# SPA (react-router-dom, routage côté client) + reverse proxy vers le
# backend PHP sous /api/ : le SPA appelle des URLs relatives comme
# "/api/api_reports.php" (voir VITE_API_BASE_URL=/api dans le Dockerfile),
# et ce bloc les transmet au conteneur "backend" en retirant le préfixe
# /api/ (le slash final de proxy_pass fait la réécriture) — le backend sert
# ses fichiers à plat (api_reports.php à la racine), sans sous-dossier /api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
